<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProcPro</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="title-row">
        <img class="title-logo" src="../logo.png" alt="ProProc logo" />
        <h1>ProProc</h1>
      </header>
      <nav class="tabs" aria-label="Popup sections">
        <button class="tab is-active" type="button" data-tab="focus">Focus</button>
        <button class="tab" type="button" data-tab="blocked">Blocked</button>
        <button class="tab" type="button" data-tab="settings">Settings</button>
      </nav>

      <section class="panel is-active" data-panel="focus">
        <p class="status-line">
          Status:
          <span class="status-value" id="mode-status">Ready</span>
        </p>
        <p class="status-line">
          Phase:
          <span class="status-value" id="phase-status">Focus</span>
        </p>

        <div class="timer-display" aria-live="polite">
          <span id="timer">25:00</span>
        </div>

        <div class="stats-grid" aria-label="Focus stats">
          <div class="stat-card">
            <span class="stat-value" id="blocked-attempts">0</span>
            <span class="stat-label">Blocked attempts</span>
          </div>
          <div class="stat-card">
            <span class="stat-value" id="focus-hours">0.0h</span>
            <span class="stat-label">Focus streak</span>
          </div>
        </div>

        <div class="toggle-row">
          <span class="toggle-label">Work Mode</span>
          <button
            id="work-toggle"
            class="toggle-control"
            type="button"
            role="switch"
            aria-checked="false"
            aria-label="Toggle work mode"
          >
            <span class="track" aria-hidden="true">
            <span class="thumb"></span>
            </span>
          </button>
        </div>

        <button class="reset-button" id="reset-timer" type="button">Reset Timer</button>
      </section>

      <section class="panel" data-panel="blocked">
        <form id="blocked-form" class="inline-form">
          <input id="blocked-input" type="text" placeholder="Add domain (e.g. reddit.com)" />
          <button type="submit">Add</button>
        </form>
        <div class="blocked-list-container">
          <ul id="blocked-list" class="blocked-list"></ul>
        </div>
      </section>

      <section class="panel" data-panel="settings">
        <div class="settings-scroll">
          <form id="settings-form" class="settings-form">
            <label>
              Focus (minutes)
              <input id="focus-minutes" type="number" min="1" />
            </label>
            <label>
              Short break (minutes)
              <input id="short-break-minutes" type="number" min="1" />
            </label>
            <label>
              Long break (minutes)
              <input id="long-break-minutes" type="number" min="1" />
            </label>
            <label>
              Focus sessions before long break
              <input id="sessions-before-long-break" type="number" min="1" />
            </label>
            <div class="switch-row">
              <span>Auto-cycle focus and breaks</span>
              <button
                id="auto-cycle-toggle"
                class="toggle-control toggle-control-small"
                type="button"
                role="switch"
                aria-checked="true"
                aria-label="Toggle auto-cycle focus and breaks"
              >
                <span class="track" aria-hidden="true">
                  <span class="thumb"></span>
                </span>
              </button>
            </div>
            <div class="switch-row">
              <span>Cone of Silence</span>
              <button
                id="cone-of-silence-toggle"
                class="toggle-control toggle-control-small"
                type="button"
                role="switch"
                aria-checked="true"
                aria-label="Toggle Cone of Silence"
              >
                <span class="track" aria-hidden="true">
                  <span class="thumb"></span>
                </span>
              </button>
            </div>
            <div class="switch-row">
              <span>Status notifications</span>
              <button
                id="status-notifications-toggle"
                class="toggle-control toggle-control-small"
                type="button"
                role="switch"
                aria-checked="true"
                aria-label="Toggle status notifications"
              >
                <span class="track" aria-hidden="true">
                  <span class="thumb"></span>
                </span>
              </button>
            </div>
            <div class="settings-actions">
              <button id="open-popout" type="button">Open Popout</button>
              <button id="close-popout" type="button" class="ghost-button">Close Popout</button>
            </div>
            <div class="settings-actions">
              <button type="submit">Save Settings</button>
              <button id="reset-settings" type="button" class="ghost-button">Reset Defaults</button>
            </div>
          </form>
        </div>
      </section>
    </main>
    <script src="../config.js"></script>
    <script src="./popup.js"></script>
  </body>
</html>
